services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./src:/app/src:ro      # development hot-reload; remove in production
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

volumes:
  pgdata:
