name: Release Pipeline
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t demo-api:${{ github.sha }} .
          docker save demo-api:${{ github.sha }} -o /tmp/image.tar

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: /tmp/image.tar

      - name: Smoke test
        run: |
          docker load -i /tmp/image.tar
          docker run -d --name test-api -p 8080:8080 -e NODE_ENV=test demo-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          echo "TEST_STAGE_PASSED" >> $GITHUB_STEP_SUMMARY

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release   # ← manual approval gate
    steps:
      - uses: actions/checkout@v4

      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: api-image
          path: /tmp

      - name: Verify artefact
        run: |
          docker load -i /tmp/image.tar
          docker run -d --name release-api -p 8081:8080 -e NODE_ENV=release demo-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8081/health || exit 1
          echo "RELEASE_ARTEFACT_VERIFIED" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: /tmp/image.tar
          body: |
            ## Evidence
            - Test stage: smoke test passed
            - Release stage: manual approval granted
            - Artefact: image.tar attached
